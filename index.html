<script>const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);

function actx(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch{}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,t0,d,type='sine',vol=.1,f2){const a=muted?null:actx();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}

const weekOf=ts=>Math.floor((ts/DAY+3)/7);
function weeksOf(id){return new Set(S.ratings.filter(r=>r.userId===id).map(r=>weekOf(r.ts)))}
function streakOf(id){const ws=weeksOf(id);let c=weekOf(Date.now());if(!ws.has(c))c--;let n=0;while(ws.has(c)){n++;c--}return n}
function bestStreak(id){const a=[...weeksOf(id)].sort((x,y)=>x-y);let b=0,c=0;a.forEach((x,i)=>{c=i&&x===a[i-1]+1?c+1:1;b=Math.max(b,c)});return b}

  if(c.type==='genre')return f.genre===c.value;if(c.type==='before')return !!(+f.year&&+f.year<+c.value);return true}
function chalCount(c,id){const rs=S.ratings.filter(r=>r.userId===id&&chalMatch(c,r));
  if(c.type==='genres')return new Set(rs.map(r=>S.films.find(f=>f.id===r.filmId)?.genre).filter(Boolean)).size;return rs.length}
const chalDone=(c,id)=>chalCount(c,id)>=c.target;
const chalLabel=c=>{const n=c.target,p=n>1?'s':'';return c.type==='genre'?`Notez ${n} film${p} de genre « ${c.value} »`:c.type==='before'?`Notez ${n} film${p} d’avant ${c.value}`:c.type==='genres'?`Notez des films de ${n} genres différents`:`Notez ${n} films ce mois-ci`};

/* cartes à collectionner */
function cardOf(r){const f=S.films.find(x=>x.id===r.filmId);if(!f)return'common';
  const first=Math.min(...team(r.filmId).map(x=>x.ts));if(r.ts===first&&r.userId!==S.cfg.directorId)return'legendary';
  const h=dirOf(r.filmId);if(h&&Math.abs(h.stars-r.stars)>=6)return'holo';
  return r.ts-f.added<=2*DAY?'rare':'common'}

/* gamification */
function stats(id,from=0,to=Infinity,withBadges=false){
  const all=from===0&&to===Infinity,dirId=S.cfg.directorId,rs=S.ratings.filter(r=>r.userId===id&&r.ts>=from&&r.ts<to);
  let xp=0,exact=0,contra=0,shots=0,tro=0,leg=0,likes=0;
  rs.forEach(r=>{xp+=10;if(r.text)xp+=15;if(r.shot){xp+=10;shots++}likes+=(r.likes||[]).length;xp+=2*(r.likes||[]).length;if(r.trophy){xp+=25;tro++}
    const h=dirId&&id!==dirId?rOf(r.filmId,dirId):null;
    if(h){if(r.bet!=null&&Math.abs(r.bet-h.stars)<=1){xp+=20;exact++}if(Math.abs(r.stars-h.stars)>=6)contra++}
    if(cardOf(r)==='legendary')leg++});
  const done=S.chals.filter(c=>chalDone(c,id)).length,streak=streakOf(id);
  if(all)xp+=5*weeksOf(id).size+40*done;
  const genres=new Set(rs.map(r=>S.films.find(f=>f.id===r.filmId)?.genre).filter(Boolean)).size;
  let lvl=0;LEVELS.forEach((l,i)=>{if(xp>=l[0])lvl=i});const next=LEVELS[lvl+1];
  const badges=withBadges?badgeFams(id,xp,lvl):[];
  return{xp,lvl,name:LEVELS[lvl][1],pct:next?(xp-LEVELS[lvl][0])/(next[0]-LEVELS[lvl][0])*100:100,next,badges,count:rs.length,streak}}

function buildLocal(){
  const f=R.f,have=new Set(S.films.map(x=>x.title.toLowerCase())),seen=new Set();
  const ideas=S.ideas.map(i=>({title:i.title,year:i.year||'',director:i.director||'',genre:i.genre||'Drame',from:'idea',id:i.id}));
  const cat=CAT.map(([title,year,director,genre])=>({title,year,director,genre,from:'cat'}));
  const okF=x=>{const y=+x.year;return(!f.genres.length||f.genres.includes(x.genre))&&(!f.from||!y||y>=+f.from)&&(!f.to||!y||y<=+f.to)&&(!f.dir.trim()||norm(x.director).includes(norm(f.dir)))};
  let p=(R.src==='ideas'?ideas:[...shuffle(ideas).slice(0,4),...shuffle(cat)]).filter(x=>{const k=x.title.toLowerCase();if(have.has(k)||seen.has(k)||!okF(x))return false;seen.add(k);return true});
  R.total=p.length;if(!R.seen)R.seen=new Set();
  let fresh=p.filter(x=>!R.seen.has(x.title));if(fresh.length<12){R.seen=new Set();fresh=p}
  R.pool=[...fresh.filter(x=>x.from==='idea').slice(0,4),...fresh.filter(x=>x.from!=='idea')].slice(0,12);R.pool=shuffle(R.pool);R.pool.forEach(x=>R.seen.add(x.title));R.result=null}

/* Wikidata : base ouverte (CC0), interrogée depuis le navigateur */
const WDG={'Drame':'Q130232','Comédie':'Q157443','Science-fiction':'Q471839','Thriller':'Q2484376','Documentaire':'Q93204','Animation':'Q202866','Policier':'Q959790'};
const WDQ=Object.fromEntries(Object.entries(WDG).map(([k,v])=>[v,k]));
async function wdGet(url,ms=20000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(t)}}
const sparql=(q,ms)=>wdGet('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(q),ms);
const qidOf=u=>u.slice(u.lastIndexOf('/')+1);
const LBL='SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en". }';
function wdRows(j){const m=new Map();
  (j.results?.bindings||[]).forEach(b=>{const id=qidOf(b.f.value),t=b.fLabel?.value||'';if(!t||/^Q\d+$/.test(t))return;
    const o=m.get(id)||{qid:id,title:t,year:'',director:'',genre:'Drame',poster:'',sl:0,wiki:'',from:'wd'};
    if(b.sl)o.sl=Math.max(o.sl,+b.sl.value||0);
    if(b.art&&!o.wiki)o.wiki=decodeURIComponent(qidOf(b.art.value)).replace(/_/g,' ');
    if(b.year&&(!o.year||+b.year.value<+o.year))o.year=b.year.value;
    if(b.dLabel&&!o.director&&!/^Q\d+$/.test(b.dLabel.value))o.director=b.dLabel.value;
    if(b.gq){const g=WDQ[qidOf(b.gq.value)];if(g)o.genre=g}
    if(b.pf&&!o.poster)o.poster=b.pf.value.replace(/^http:/,'https:')+'?width=400';
    m.set(id,o)});
  return[...m.values()]}
async function wdPersonIds(name){
  R.pc=R.pc||{};const k=norm(name);if(R.pc[k])return R.pc[k];
  const api=l=>'https://www.wikidata.org/w/api.php?action=wbsearchentities&search='+encodeURIComponent(name)+'&language='+l+'&uselang='+l+'&type=item&limit=6&format=json&origin=*';
  const rs=await Promise.all(['fr','en'].map(l=>wdGet(api(l),10000).catch(()=>null)));
  return R.pc[k]=[...new Set(rs.flatMap(r=>(r?.search||[]).map(x=>x.id)))].filter(x=>/^Q\d+$/.test(x)).slice(0,8)}
async function wdPool(F,y0,y1,ids){
  // requête légère : fenêtre de 2 ans (ou films d'une personne), sans tri ni agrégat, limitée à 120 films
  const key=JSON.stringify([F.genres,F.dur,F.pop,y0,y1,ids]);R.wd=R.wd||{};if(R.wd[key])return R.wd[key];
  const gs=(F.genres.length?F.genres.map(g=>WDG[g]):Object.values(WDG)).map(x=>'wd:'+x).join(' ');
  const [smin,smax]=({all:[6,1e9],known:[20,1e9],top:[50,1e9],gems:[6,19]})[F.pop]||[6,1e9];
  const [dmin,dmax]=({short:[1,89],mid:[90,120],long:[121,400]})[F.dur]||[0,0];
  const person=ids.dir.length||ids.act.length;
  const win=(person&&!F.from&&!F.to)?'':`FILTER(?date >= "${y0}-01-01T00:00:00Z"^^xsd:dateTime && ?date < "${y1}-01-01T00:00:00Z"^^xsd:dateTime)`;
  const q=`SELECT ?f ?fLabel ?year ?gq ?dLabel WHERE {
    { SELECT DISTINCT ?f ?gq ?year WHERE {
        VALUES ?gq { ${gs} }
        ?f wdt:P31 wd:Q11424 ; wdt:P136 ?gq ; wdt:P577 ?date ; wikibase:sitelinks ?sl .
        ${ids.dir.length?`VALUES ?pd { ${ids.dir.map(i=>'wd:'+i).join(' ')} } ?f wdt:P57 ?pd .`:''}
        ${ids.act.length?`VALUES ?pa { ${ids.act.map(i=>'wd:'+i).join(' ')} } ?f wdt:P161 ?pa .`:''}
        ${F.dur?`?f wdt:P2047 ?dur . FILTER(?dur >= ${dmin} && ?dur <= ${dmax})`:''}
        FILTER(?sl >= ${smin} && ?sl <= ${smax})
        ${win}
        BIND(YEAR(?date) AS ?year)
      } LIMIT 120 }
    OPTIONAL { ?f wdt:P57 ?d }
    ${LBL} }`;
  const rows=wdRows(await sparql(q,12000));R.wd[key]=rows;return rows}
async function wdPoster(qid){
  const j=await sparql(`SELECT ?pf ?im WHERE { OPTIONAL { wd:${qid} wdt:P3383 ?pf } OPTIONAL { wd:${qid} wdt:P18 ?im } } LIMIT 1`);
  const b=j.results?.bindings?.[0];const u=b?.pf?.value||b?.im?.value;return u?u.replace(/^http:/,'https:')+'?width=400':''}
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function localSearch(q){const n=norm(q);if(n.length<2)return[];
  return CAT.filter(c=>norm(c[0]).includes(n)).sort((a,b)=>(norm(a[0]).startsWith(n)?0:1)-(norm(b[0]).startsWith(n)?0:1)).slice(0,5).map(([title,year,director,genre])=>({qid:'',title,year:String(year),director,genre,poster:'',sl:0,wiki:'',from:'cat'}))}
function mergeResults(list,q){const n=norm(q),map=new Map();
  list.forEach(x=>{const k=norm(x.title)+'|'+(x.year||'');const o=map.get(k);
    if(!o)map.set(k,{...x});else{if(!o.qid&&x.qid)o.qid=x.qid;if(!o.poster&&x.poster)o.poster=x.poster;if(!o.director&&x.director)o.director=x.director;if(!o.wiki&&x.wiki)o.wiki=x.wiki;o.sl=Math.max(o.sl||0,x.sl||0)}});
  const arr=[...map.values()],dated=new Set(arr.filter(x=>x.year).map(x=>norm(x.title)));
  const rank=x=>{const t=norm(x.title);return t===n?0:t.startsWith(n)?1:t.includes(n)?2:3};
  return arr.filter(x=>x.year||!dated.has(norm(x.title))).sort((a,b)=>rank(a)-rank(b)||(b.sl||0)-(a.sl||0)).slice(0,8)}
async function wikiThumbs(items){
  const todo=items.filter(x=>!x.poster&&x.wiki);if(!todo.length)return;
  try{const j=await wdGet('https://fr.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=400&redirects=1&format=json&origin=*&titles='+encodeURIComponent(todo.map(x=>x.wiki).join('|')),10000);
    const img=new Map(),al=new Map();Object.values(j.query?.pages||{}).forEach(p=>p.thumbnail&&img.set(p.title,p.thumbnail.source));
    [...(j.query?.normalized||[]),...(j.query?.redirects||[])].forEach(r=>al.set(r.from,r.to));
    todo.forEach(x=>{let n=x.wiki;n=al.get(n)||n;n=al.get(n)||n;const u=img.get(n);if(u)x.poster=u})}catch{}}
async function wdSearch(text){
  const api=l=>'https://www.wikidata.org/w/api.php?action=wbsearchentities&search='+encodeURIComponent(text)+'&language='+l+'&uselang='+l+'&type=item&limit=30&format=json&origin=*';
  const rs=await Promise.all(['fr','en'].map(l=>wdGet(api(l),10000).catch(()=>null)));
  const ids=[...new Set(rs.flatMap(r=>(r?.search||[]).map(x=>x.id)))].filter(x=>/^Q\d+$/.test(x)).slice(0,50);
  if(!ids.length)return[];
  const q=`SELECT ?f ?fLabel ?year ?gq ?dLabel ?pf ?sl ?art WHERE { VALUES ?f { ${ids.map(i=>'wd:'+i).join(' ')} }
    ?f wdt:P31/wdt:P279* wd:Q11424 . FILTER NOT EXISTS { ?f wdt:P31 wd:Q24862 } FILTER NOT EXISTS { ?f wdt:P31/wdt:P279* wd:Q5398426 }
    ?f wikibase:sitelinks ?sl . OPTIONAL { ?f wdt:P577 ?date } BIND(YEAR(?date) AS ?year) OPTIONAL { ?f wdt:P57 ?d } OPTIONAL { ?f wdt:P136 ?gq } OPTIONAL { ?f wdt:P3383 ?pf }
    OPTIONAL { ?art schema:about ?f ; schema:isPartOf <https://fr.wikipedia.org/> } ${LBL} } LIMIT 600`;
  const res=mergeResults(wdRows(await sparql(q,15000)),text);await wikiThumbs(res);return res}

/* fiche film : Wikidata + Wikipédia (+ TMDB si une clé est fournie dans config.js) */
const tmdbKey=()=>(window.CINECLUB||{}).tmdbKey||'';
const hm=m=>m>=60?`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`:`${m} min`;
const triedEnrich=new Set();
async function fetchDetails(f){
  const patch={};let qid=f.qid;
  if(!qid){try{const r=(await wdSearch(f.title)).filter(x=>x.qid);const m=(f.year?r.find(x=>String(x.year)===String(f.year)):null)||r[0];
    if(m){qid=m.qid;if(!f.director&&m.director)patch.director=m.director;if(!f.year&&m.year)patch.year=m.year;if(m.poster)patch.poster=m.poster}}catch{}}
  let wikiName='',imdb='',cast=[],country='',dur=0,pf='';
  if(qid){patch.qid=qid;
    try{const j=await sparql(`SELECT ?art ?dur ?imdb ?castLabel ?countryLabel ?pf WHERE { BIND(wd:${qid} AS ?f)
      OPTIONAL { ?art schema:about ?f; schema:isPartOf <https://fr.wikipedia.org/> }
      OPTIONAL { ?f wdt:P2047 ?dur } OPTIONAL { ?f wdt:P345 ?imdb } OPTIONAL { ?f wdt:P161 ?cast } OPTIONAL { ?f wdt:P495 ?country } OPTIONAL { ?f wdt:P3383 ?pf }
      ${LBL} } LIMIT 30`);
      (j.results?.bindings||[]).forEach(b=>{
        if(b.art&&!wikiName)wikiName=decodeURIComponent(b.art.value.split('/wiki/')[1]||'');
        if(b.dur&&!dur)dur=Math.round(+b.dur.value);if(b.imdb&&!imdb)imdb=b.imdb.value;
        if(b.castLabel&&!/^Q\d+$/.test(b.castLabel.value)&&!cast.includes(b.castLabel.value))cast.push(b.castLabel.value);
        if(b.countryLabel&&!/^Q\d+$/.test(b.countryLabel.value)&&!country)country=b.countryLabel.value;
        if(b.pf&&!pf)pf=b.pf.value.replace(/^http:/,'https:')+'?width=400'});
      if(dur>600)dur=Math.round(dur/60);if(dur>0&&dur<600)patch.runtime=dur;
      if(cast.length)patch.cast=cast.slice(0,6);if(country)patch.country=country;if(pf)patch.poster=pf}catch{}}
  if(wikiName){try{const w=await wdGet('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(wikiName),12000);
    if(w.extract)patch.synopsis=w.extract.slice(0,900);
    patch.wiki=w.content_urls?.desktop?.page||('https://fr.wikipedia.org/wiki/'+encodeURIComponent(wikiName));
    if(!patch.poster&&!f.poster){const img=w.originalimage?.source||w.thumbnail?.source;if(img)patch.poster=img}}catch{}}
  const k=tmdbKey();
  if(k){try{let id=null;
    if(imdb){const r=await wdGet(`https://api.themoviedb.org/3/find/${imdb}?api_key=${k}&external_source=imdb_id`,12000);id=r.movie_results?.[0]?.id}
    if(!id){const r=await wdGet(`https://api.themoviedb.org/3/search/movie?api_key=${k}&language=fr-FR&query=${encodeURIComponent(f.title)}${f.year?'&year='+f.year:''}`,12000);id=r.results?.[0]?.id}
    if(id){const d=await wdGet(`https://api.themoviedb.org/3/movie/${id}?api_key=${k}&language=fr-FR&append_to_response=credits,reviews`,15000);
      if(d.overview)patch.synopsis=d.overview.slice(0,900);if(d.poster_path)patch.poster='https://image.tmdb.org/t/p/w500'+d.poster_path;
      if(d.runtime)patch.runtime=d.runtime;
      const cr=(d.credits?.cast||[]).slice(0,6).map(c=>c.name);if(cr.length)patch.cast=cr;
      const dr=(d.credits?.crew||[]).find(c=>c.job==='Director');if(dr&&!f.director)patch.director=dr.name;
      patch.tmdb={id,rating:d.vote_average||0,votes:d.vote_count||0,
        reviews:(d.reviews?.results||[]).slice(0,3).map(r=>({a:r.author||'Anonyme',r:r.author_details?.rating??null,t:String(r.content||'').replace(/\s+/g,' ').slice(0,500)}))}}}catch{}}
  if(!patch.poster&&!f.poster){const u=await wikiPoster(f.title,f.year||patch.year);if(u)patch.poster=u}
  patch.enriched=Date.now();return patch}
async function enrichFilm(id,force){
  const f=S.films.find(x=>x.id===id);if(!f||!isDir())return;if(!force&&(f.enriched||triedEnrich.has(id)))return;triedEnrich.add(id);
  const p=await fetchDetails(f);
  // ne pas écraser ce qu'Hervé a saisi lui-même
  if(f.poster&&!force)delete p.poster;if(f.director&&!force)delete p.director;if(f.year&&!force)delete p.year;
  await upd('films/'+id,p)}
async function wikiPoster(title,year){
  try{const j=await wdGet('https://fr.wikipedia.org/w/api.php?action=query&generator=search&gsrnamespace=0&gsrlimit=6&gsrsearch='+encodeURIComponent(`${title} film${year?' '+year:''}`)+'&prop=pageimages&piprop=thumbnail&pithumbsize=400&format=json&origin=*',10000);
    const pages=Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index).filter(p=>p.thumbnail),n=norm(title);
    const best=pages.find(p=>norm(p.title).startsWith(n)&&(!year||/film/i.test(p.title)||p.title.includes(String(year))))||pages.find(p=>norm(p.title).startsWith(n))||pages.find(p=>norm(p.title).includes(n));
    return best?.thumbnail.source||''}catch{return''}}
const thumbCache={},thumbTried=new Set(),thumbKey=m=>norm(m.title)+'|'+(m.year||'');
function fillThumb(m){const key=thumbKey(m);thumbTried.add(key);
  wikiPoster(m.title,m.year).then(u=>{thumbCache[key]=u||'';if(!u)return;const b=[...document.querySelectorAll('#sug button[data-key]')].find(x=>x.dataset.key===key);if(!b)return;
    const ph=b.querySelector('.ph');if(ph){const img=document.createElement('img');img.src=u;img.alt='';img.loading='lazy';img.onerror=()=>img.replaceWith(ph);ph.replaceWith(img)}
    try{const o=JSON.parse(b.dataset.s);o.poster=u;b.dataset.s=JSON.stringify(o)}catch{}}).catch(()=>{})}
let posterCache={};try{posterCache=JSON.parse(localStorage.getItem('cineclub-posters')||'{}')}catch{}
const posterTried=new Set();
async function fillPosters(){
  const todo=S.films.filter(f=>!f.poster&&!posterTried.has(f.id)).slice(0,12);
  for(const f of todo){posterTried.add(f.id);
    if(isDir()){await enrichFilm(f.id,true);

function rFilterCount(){const f=R.f;return(f.genres.length?1:0)+((f.from||f.to)?1:0)+(f.dir.trim()?1:0)+(f.act.trim()?1:0)+(f.dur?1:0)+(f.pop!=='all'?1:0)}
function scheduleBuild(){clearTimeout(R.bt);R.bt=setTimeout(buildPool,450)}
async function buildPool(){
  const tok=R.tok=(R.tok||0)+1;R.result=null;R.err='';R.det=null;rModal=false;
  if(R.src!=='wd'){buildLocal();R.loading=false;return render()}
  R.loading=true;R.pool=[];render();
  const F=R.f,hasF=rFilterCount()>0;
  try{
    const have=new Set(S.films.map(f=>f.title.toLowerCase()));
    const ideas=shuffle(S.ideas.map(i=>({title:i.title,year:i.year||'',director:i.director||'',genre:i.genre||'Drame',from:'idea',id:i.id}))).filter(x=>(!F.genres.length||F.genres.includes(x.genre))&&(!F.dir.trim()&&!F.act.trim())).slice(0,3);
    const ids={dir:[],act:[]};
    if(F.dir.trim()){ids.dir=await wdPersonIds(F.dir);if(tok!==R.tok)return;if(!ids.dir.length)throw Object.assign(new Error('user'),{user:`Personne trouvée pour la réalisation « ${F.dir} ». Vérifiez l’orthographe.`})}
    if(F.act.trim()){ids.act=await wdPersonIds(F.act);if(tok!==R.tok)return;if(!ids.act.length)throw Object.assign(new Error('user'),{user:`Personne trouvée pour « ${F.act} ». Vérifiez l’orthographe.`})}
    const person=ids.dir.length||ids.act.length,lo=+F.from||1925,hi=Math.min(+F.to||2025,2026);
    R.wdSeen=R.wdSeen||new Set();R.years=R.years||new Set();
    let all=[];const maxTries=person?1:(F.dur||F.pop!=='all'||F.genres.length)?8:4;
    for(let t=0;t<maxTries&&all.length<12;t++){
      let y0=lo,y1=hi+1;
      if(!person||F.from||F.to){const span=Math.max(1,hi-lo);let guard=0;do{y0=lo+Math.floor(Math.random()*Math.max(1,span-1));guard++}while(R.years.has(JSON.stringify(F)+y0)&&guard<30);R.years.add(JSON.stringify(F)+y0);y1=Math.min(y0+2,hi+1);if(person){y0=lo;y1=hi+1}}
      const batch=await wdPool(F,y0,y1,ids);if(tok!==R.tok)return;
      batch.filter(x=>!have.has(x.title.toLowerCase())&&!R.wdSeen.has(x.qid)&&!all.some(a=>a.qid===x.qid)).forEach(x=>all.push(x))}
    if(all.length<2)throw new Error('vide');
    const pick=shuffle(all).slice(0,12-ideas.length);pick.forEach(x=>R.wdSeen.add(x.qid));
    R.pool=shuffle([...ideas,...pick])}
  catch(x){if(tok!==R.tok)return;
    if(x.user){R.err=x.user;R.pool=[]}
    else if(x.message==='vide'&&hasF){R.err='Aucun film ne correspond à ces filtres. Essayez d’en retirer un.';R.pool=[]}
    else{R.err='La base en ligne ne répond pas : catalogue local utilisé.';buildLocal()}}
  R.loading=false;render()}

function drawWheel(){const c=$('#wheel');if(!c||!R.pool.length)return;const x=c.getContext('2d'),W=c.width,cx=W/2,r=W/2-8,n=R.pool.length,seg=2*Math.PI/n;x.clearRect(0,0,W,W);
  for(let i=0;i<n;i++){x.beginPath();x.moveTo(cx,cx);x.arc(cx,cx,r,R.angle+i*seg,R.angle+(i+1)*seg);x.closePath();x.fillStyle=GRAD[i%6][i%2?1:0];x.fill();x.strokeStyle='#0f0e14';x.lineWidth=3;x.stroke();
    x.save();x.translate(cx,cx);x.rotate(R.angle+(i+.5)*seg);x.textAlign='right';x.fillStyle='#fff';const t=R.pool[i].title;x.font=(t.length>15?'600 14px':'600 16px')+' Inter,sans-serif';x.fillText(t.length>19?t.slice(0,18)+'…':t,r-18,6);x.restore()}
  x.beginPath();x.arc(cx,cx,34,0,7);x.fillStyle='#0f0e14';x.fill();x.fillStyle='#ffcc00';x.font='28px sans-serif';x.textAlign='center';x.fillText('🎬',cx,cx+10)}
function spin(){if(R.spinning||R.pool.length<2)return;R.spinning=true;R.result=null;const start=R.angle,extra=2*Math.PI*(5+Math.random()*3)+Math.random()*2*Math.PI,t0=performance.now(),D=4200;
  const step=t=>{const k=Math.min(1,(t-t0)/D);R.angle=start+extra*(1-Math.pow(1-k,3));drawWheel();{const sg=2*Math.PI/R.pool.length,ix=Math.floor((((-Math.PI/2-R.angle)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/sg);if(ix!==R.lastIx){R.lastIx=ix;SFX.tick()}}
    if(k<1)requestAnimationFrame(step);else{R.spinning=false;const seg=2*Math.PI/R.pool.length,th=((-Math.PI/2-R.angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);R.result=R.pool[Math.min(R.pool.length-1,Math.floor(th/seg))];SFX.win();rModal=true;loadResultDetails()}};
  requestAnimationFrame(step)}

function filmStep(d){editFilm=null;revLimit=8;revSort='recent';const l=[...S.films].sort((a,b)=>b.added-a.added),i=l.findIndex(x=>x.id===film);if(i<0)return;film=l[(i+d+l.length)%l.length].id;dTxt=dShot=null;bet=0;render();if(isDir())enrichFilm(film)}

function setRating(fid,v){const old=rOf(fid,S.meId),r=old?{...old,stars:v}:base(fid,{stars:v});bet=0;put('ratings/'+r.id,r).then(ok=>ok&&(SFX.ding(),!old&&toast('+10 XP, merci pour votre note !')))}

function csvExport(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['Film','Année','Genre','Note Hervé','Moyenne équipe','Participation','Avis écrits']];
  S.films.filter(f=>f.status!=='upcoming').forEach(f=>{const t=team(f.id),a=avg(t.map(r=>r.stars)),h=dirOf(f.id);rows.push([f.title,f.year,f.genre,h?fmt(h.stars):'',a!=null?fmt(a):'',cons().length?Math.round(t.length/cons().length*100)+'%':'',t.filter(r=>r.text).length])});
  return'﻿'+rows.map(r=>r.map(q).join(';')).join('\n')}
async function shareCard(fid){
  const f=S.films.find(x=>x.id===fid),r=rOf(fid,S.meId);if(!f||!r||!S.dl)return;
  const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d'),[a,b]=GRAD[hash(f.title)%GRAD.length];
  const g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,1080,1350);
  x.fillStyle='#ffffff22';x.fillRect(60,60,960,1230);x.fillStyle='#fff';x.textAlign='left';
  x.font='600 34px Inter,sans-serif';x.fillText('CINÉ-CLUB IMAGERIE',100,140);
  const wrapT=(t,mx,y,lh,font,maxL)=>{x.font=font;const ws=t.split(' ');let l='',n=0;for(const wd of ws){const tt=l?l+' '+wd:wd;if(x.measureText(tt).width>mx&&l){x.fillText(l,100,y);y+=lh;l=wd;if(++n>=maxL-1)break}else l=tt}x.fillText(l,100,y);return y+lh};
  let y=wrapT(f.title,880,420,120,'800 108px Fraunces,Georgia,serif',3);
  x.font='500 40px Inter,sans-serif';x.fillStyle='#ffffffcc';x.fillText(`${f.year||''}${f.director?' · '+f.director:''}`,100,y+10);
  x.fillStyle='#ffcc00';x.font='96px sans-serif';let s='';for(let i=1;i<=5;i++)s+=r.stars>=i*2?'★':r.stars===i*2-1?'⯪':'☆';x.fillText(s,100,y+170);
  x.fillStyle='#fff';if(r.text)wrapT('« '+r.text+' »',880,y+290,56,'italic 44px Georgia,serif',5);
  x.font='500 34px Inter,sans-serif';x.fillStyle='#ffffffcc';x.fillText(nameOf(S.meId),100,1230);
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));
  try{await S.dl.save({filename:'carte-'+f.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.png',data:blob})}catch{}
}

const COLLS=['films','ratings','members','config','ideas','duels','dvotes','challenges','watch','likes','trophies'];

function derive(){
  const arr=c=>[...cache[c]].map(([id,d])=>({id,...d}));

  const lk={};arr('likes').forEach(l=>(lk[l.ratingId]=lk[l.ratingId]||[]).push(l.userId));
  S.films=arr('films').map(f=>(!f.poster&&posterCache[f.id])?{...f,poster:posterCache[f.id]}:f);S.ideas=arr('ideas');S.duels=arr('duels');S.dvotes=arr('dvotes');S.chals=arr('challenges');S.watch=arr('watch');
  S.ratings=arr('ratings').map(r=>({...r,likes:lk[r.id]||[],trophy:cache.trophies.get(r.id)?.kind||null}));
  const lv=cache.config.get('live')?{...cache.config.get('live')}:null;
  if(lastLive&&lastLive.state==='open'&&lv&&lv.state==='revealed'){SFX.reveal();toast('Les résultats de la séance sont révélés 🎬')}

async function loadAll(){
  const [d,p]=await Promise.all([sb.from('docs').select('coll,id,data'),sb.from('profiles').select('id,name,role')]);

async function wr(path,op,data){
  const [c,id]=path.split('/'),m=cache[c];
  if(!m)throw{code:'invalid_argument'};
  if(op==='delete'){m.delete(id);derive();render();
    const {error}=await sb.from('docs').delete().eq('coll',c).eq('id',id);if(error){await loadAll().catch(()=>{});render();throw{code:'invalid_argument'}}return}
  const doc=op==='update'?{...(m.get(id)||{}),...data}:{...data};delete doc.id;if(c==='ratings'){delete doc.likes;delete doc.trophy}
  m.set(id,doc);derive();render();
  const {error}=await sb.from('docs').upsert({coll:c,id,data:doc,owner:S.meId});
  if(error){await loadAll().catch(()=>{});render();throw{code:'invalid_argument'}}}

  authMsg='';if(d.p1!==d.p2){authMsg='Les deux mots de passe ne sont pas identiques.';return render()}
  const {data,error}=await sb.auth.updateUser({password:d.p1});
  if(error){authMsg=/same|different/i.test(error.message)?'Choisissez un mot de passe différent de l’ancien.':'Impossible de changer le mot de passe : '+error.message;return render()}
  recovery=false;try{history.replaceState(null,'',location.pathname)}catch{}
  return enter(data.user)}
async function doAuth(d){
  authMsg='';authOk=false;const em=d.email.trim().toLowerCase();
  if(authTab==='forgot'){const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    if(error){authMsg=/rate|seconds|limit/i.test(error.message)?'Trop de demandes : réessayez dans une minute.':'Envoi impossible : '+error.message}else{authOk=true;authMsg='Si un compte existe pour cette adresse, un e-mail vient d’être envoyé. Pensez à vérifier les courriers indésirables.'}
    return render()}
  if(authTab==='in'){const {data,error}=await sb.auth.signInWithPassword({email:em,password:d.pw});if(error){authMsg='E-mail ou mot de passe incorrect.';return render()}return enter(data.user)}
  const {data,error}=await sb.auth.signUp({email:em,password:d.pw,options:{data:{name:d.name.trim(),invite:d.invite.trim()}}});
  if(error){authMsg=/database error|invite|invitation/i.test(error.message)?'Code d’invitation invalide.':error.message;return render()}
  if(!data.session){authMsg='Compte créé. Confirmez votre adresse e-mail puis connectez-vous.';authTab='in';return render()}
  return enter(data.user)}
let pollT=null;
async function enter(user){
  S.meId=user.id;S.db=adapter;S.dl=saver;S.ready=false;render();
  try{await loadAll()}catch{S.db=null;authMsg='Connexion au serveur impossible.';S.ready=true;return render()}
  if(!cache.members.has(S.meId))put('members/'+S.meId,{emoji:EMOJIS[hash(S.meId)%EMOJIS.length]});
  S.ready=true;render();fillPosters();setTimeout(maybePodium,900);try{if(!localStorage.getItem(tourKey())){tour={i:0};render()}}catch{}clearInterval(pollT);
  pollT=setInterval(async()=>{if(document.hidden||adding||tour||view==='guide'||dTxt||dShot||dGif||S.db===null||/INPUT|TEXTAREA/.test(document.activeElement?.tagName||''))return;try{await loadAll();render();fillPosters()}catch{}},8000)}
(async function(){
  const cf=window.CINECLUB||{};
  if(!cf.url||!cf.anonKey||/VOTRE/.test(cf.url)){S.ready=true;S.setup=true;return render()}
  sb=supabase.createClient(cf.url,cf.anonKey);
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovery=true;clearInterval(pollT);S.db=null;S.ready=true;render();return}if(ev==='SIGNED_OUT'){clearInterval(pollT);S.db=null;S.meId=null;view='home';film=null;render()}});
  if(/type=recovery/.test(location.hash))recovery=true;
  const {data:{session}}=await sb.auth.getSession();
  if(recovery){S.ready=true;return render()}
  if(session)await enter(session.user);else{S.ready=true;render()}
})();
</script>
