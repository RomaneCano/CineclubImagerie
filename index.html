:root{color-scheme:dark;--bg:#0f0e14;--panel:#17161f;--panel2:#1f1e2a;--line:#2b2a38;--tx:#f3f1ea;--mut:#9a98aa;--acc:#ffcc00;--acc2:#3d6bff;--ok:#4cd6a0;--bad:#ff6b81;--r:16px}
*{box-sizing:border-box;margin:0}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0;background:radial-gradient(1200px 600px at 80% -10%,#26214a55,transparent),var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:#1a1500;font-weight:600;padding:10px 18px;border-radius:999px;transition:.15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.chip{padding:6px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mut);white-space:nowrap;font-size:13px}
.chip.on{background:var(--acc);color:#1a1500;border-color:var(--acc);font-weight:600}
body::before{content:'';position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:14px;align-items:center;padding:12px 0;margin:0 -16px;padding-left:16px;padding-right:16px;background:#0f0e14cc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-family:Fraunces;font-weight:800;font-size:20px}.logo b{color:var(--acc)}
nav{display:flex;gap:4px;margin-left:12px;min-width:0}nav button{padding:8px 14px;border-radius:999px;color:var(--mut)}nav button.on{background:var(--panel2);color:var(--tx)}
.sp{flex:1}
.search{max-width:260px;border-radius:999px}
.me{display:flex;align-items:center;gap:10px;background:var(--panel);padding:5px 12px 5px 6px;border-radius:999px;border:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:16px}
.xp{width:70px;height:6px;background:var(--line);border-radius:9px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff8a3d)}
main{max-width:1180px;margin:0 auto;padding-block:28px 90px}
.hero{display:grid;grid-template-columns:240px 1fr;gap:32px;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:24px;padding:28px;margin-bottom:28px;position:relative;overflow:hidden}
.hero .k{color:var(--acc);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.hero h2{font-size:38px;line-height:1.1;margin:6px 0 8px}
.pitch{border-left:3px solid var(--acc);padding:4px 0 4px 14px;color:#dcd9e6;font-style:italic;margin:14px 0}
.meta{color:var(--mut);font-size:14px}
.poster{aspect-ratio:2/3;border-radius:12px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;box-shadow:0 14px 34px #0008;background-size:cover;background-position:center}
.poster b{font-family:Fraunces;font-size:20px;line-height:1.1;text-shadow:0 2px 10px #000a}.poster small{opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px}
.card{cursor:pointer;transition:.18s}.card:hover{transform:translateY(-4px)}
.card .poster{font-size:14px}.card .tag{position:absolute;top:10px;left:10px;font-size:11px;background:#000a;padding:3px 8px;border-radius:99px}
.card .cap{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--mut)}
.stars{display:inline-flex;gap:2px;cursor:pointer;user-select:none}
.st{position:relative;font-size:22px;color:#3a3948;line-height:1}.st.f{color:var(--acc)}.st.h{background:linear-gradient(90deg,var(--acc) 50%,#3a3948 50%);-webkit-background-clip:text;color:transparent}
.stars.sm .st{font-size:14px;cursor:default}
.bar{display:flex;gap:8px;overflow:auto;margin:6px 0 20px;align-items:center}
.row{display:flex;gap:12px;align-items:center}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.rev{padding:14px 0;border-bottom:1px solid var(--line)}.rev:last-child{border:0}
.badge{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.badge.lock{opacity:.35;filter:grayscale(1)}
.lb{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dim{color:var(--mut)}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 10px 30px #ffcc0044;padding:14px 22px}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;padding:20px;overflow:auto;animation:f .15s}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:24px;width:min(880px,100%);padding:26px;position:relative;max-height:92vh;overflow:auto}
.x{position:absolute;right:16px;top:14px;font-size:22px;color:var(--mut)}
@keyframes f{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--acc);color:#1a1500;font-weight:600;padding:12px 20px;border-radius:99px;z-index:99;animation:up .3s}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:min(420px,100%);text-align:center}
.login form{display:grid;gap:10px;margin:22px 0;text-align:left}
.tabs{display:flex;gap:6px;justify-content:center}
.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--mut)}
.sug{display:grid;gap:6px;margin-top:8px}.sug button{display:flex;gap:10px;text-align:left;padding:8px;border-radius:10px;background:var(--panel)}
.emo button{font-size:22px;padding:6px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}.emo button.on{border-color:var(--acc);background:#ffcc0022}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}.kpi .pn b{font:800 30px Fraunces;display:block}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--mut);font-weight:500}

.banner{background:#ffcc0018;border:1px solid #ffcc0066;border-radius:var(--r);padding:14px 18px;margin-bottom:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.banner span{flex:1;min-width:200px}
.empty{text-align:center;padding:56px 20px}.empty h2{margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pl{min-width:0}table{min-width:620px}.tw{overflow-x:auto}
.wheelbox{position:relative;width:min(440px,100%);margin:0 auto}.wheelbox canvas{width:100%;height:auto;display:block}
.ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--acc);filter:drop-shadow(0 2px 4px #000a);z-index:2}
.live{background:linear-gradient(90deg,#ff4d6a22,transparent);border:1px solid #ff4d6a77}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4d6a;margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.vd{display:flex;gap:8px;flex-wrap:wrap}.vd button{flex:1;min-width:110px;padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-weight:600}.vd button.on{background:#ffcc0022;border-color:var(--acc)}
.wt{position:absolute;top:8px;right:8px;z-index:2;background:#000a;border-radius:99px;width:30px;height:30px;display:grid;place-items:center;font-size:14px}.wt.on{background:var(--acc)}
.card{position:relative}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}.duel .poster{cursor:pointer;aspect-ratio:3/2;transition:.15s}.duel .poster.pick{outline:3px solid var(--acc)}.vs{font:800 22px Fraunces;color:var(--acc)}

.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:24px}
.sect{margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}.sect h3{font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}.tc{border-radius:12px;padding:3px}.tc .poster{box-shadow:none;font-size:12px}.tc.rare{background:linear-gradient(135deg,#4dabff,#3d6bff)}.tc.legendary{background:linear-gradient(135deg,#ffe066,#ff8a3d,#ffcc00)}.tc.holo{background:linear-gradient(135deg,#ff6bd6,#6bd6ff,#c6ff6b,#ff6bd6)}.tc.common{background:var(--line)}.tc small.r{display:block;text-align:center;font-size:11px;padding:3px 0;color:#111;font-weight:600}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.big .pn b{font:800 40px Fraunces;display:block;line-height:1.1;color:var(--acc)}
.trow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 40px}.tro{font-size:12px;padding:3px 10px}
.wrap{min-width:0}.rev .tx{margin:6px 0 0 40px}
@media(max-width:760px){.duel{grid-template-columns:1fr}.vs{text-align:center}}
</style>

/* temps : semaines, saisons */
const weekOf=ts=>Math.floor((ts/DAY+3)/7);
function weeksOf(id){return new Set(S.ratings.filter(r=>r.userId===id).map(r=>weekOf(r.ts)))}
function streakOf(id){const ws=weeksOf(id);let c=weekOf(Date.now());if(!ws.has(c))c--;let n=0;while(ws.has(c)){n++;c--}return n}
function bestStreak(id){const a=[...weeksOf(id)].sort((x,y)=>x-y);let b=0,c=0;a.forEach((x,i)=>{c=i&&x===a[i-1]+1?c+1:1;b=Math.max(b,c)});return b}
function seasonOf(ts){const d=new Date(ts),q=Math.floor(d.getMonth()/3);return{label:`T${q+1} ${d.getFullYear()}`,from:new Date(d.getFullYear(),q*3,1).getTime(),to:new Date(d.getFullYear(),q*3+3,1).getTime()}}
const monthKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};

/* défis */
function chalMatch(c,r){const f=S.films.find(x=>x.id===r.filmId);if(!f||monthKey(r.ts)!==c.month)return false;
  if(c.type==='genre')return f.genre===c.value;if(c.type==='before')return +f.year&&+f.year<+c.value;return true}
const chalCount=(c,id)=>S.ratings.filter(r=>r.userId===id&&chalMatch(c,r)).length;
const chalDone=(c,id)=>chalCount(c,id)>=c.target;
const chalLabel=c=>c.type==='genre'?`${c.target} film${c.target>1?'s':''} de genre « ${c.value} »`:c.type==='before'?`${c.target} film${c.target>1?'s':''} d’avant ${c.value}`:`${c.target} films notés`;

/* cartes à collectionner */
function cardOf(r){const f=S.films.find(x=>x.id===r.filmId);if(!f)return'common';
  const first=Math.min(...team(r.filmId).map(x=>x.ts));if(r.ts===first&&r.userId!==S.cfg.directorId)return'legendary';
  const h=dirOf(r.filmId);if(h&&Math.abs(h.stars-r.stars)>=6)return'holo';
  return r.ts-f.added<=2*DAY?'rare':'common'}

/* gamification */
function stats(id,from=0,to=Infinity){
  const all=from===0&&to===Infinity,dirId=S.cfg.directorId,rs=S.ratings.filter(r=>r.userId===id&&r.ts>=from&&r.ts<to);
  let xp=0,exact=0,contra=0,shots=0,tro=0,leg=0,likes=0;
  rs.forEach(r=>{xp+=10;if(r.text)xp+=15;if(r.shot){xp+=10;shots++}likes+=(r.likes||[]).length;xp+=2*(r.likes||[]).length;if(r.trophy){xp+=25;tro++}
    const h=dirId&&id!==dirId?rOf(r.filmId,dirId):null;
    if(h){if(r.bet!=null&&Math.abs(r.bet-h.stars)<=1){xp+=20;exact++}if(Math.abs(r.stars-h.stars)>=6)contra++}
    if(cardOf(r)==='legendary')leg++});
  const done=S.chals.filter(c=>chalDone(c,id)).length,streak=streakOf(id);
  if(all)xp+=5*weeksOf(id).size+40*done;
  const genres=new Set(rs.map(r=>S.films.find(f=>f.id===r.filmId)?.genre).filter(Boolean)).size;
  const badges=[['🎟️','Première séance','Une première note',rs.length>=1],['✍️','Plume','3 critiques écrites',rs.filter(r=>r.text).length>=3],['🎞️','Œil de cadreuse','2 plans qui vous ont marquée',shots>=2],['🎯','Œil de lynx','Prédire la note d’Hervé à ½ étoile près',exact>=1],['🔥','Contrariante','Être en désaccord total avec Hervé',contra>=1],['🌍','Éclectique','Noter 3 genres différents',genres>=3],['🏆','Assidue','Noter 5 films',rs.length>=5],['❤️','Coup de cœur','Recevoir 3 likes',likes>=3],['🕯️','Flamme','3 semaines de suite avec un avis',streak>=3],['🥇','Lauréate','Gagner un trophée du juge Hervé',tro>=1],['✨','Collectionneuse','Obtenir une carte légendaire',leg>=1],['⛳','Défi relevé','Terminer un défi du mois',done>=1]];
  let lvl=0;LEVELS.forEach((l,i)=>{if(xp>=l[0])lvl=i});const next=LEVELS[lvl+1];
  return{xp,name:LEVELS[lvl][1],pct:next?(xp-LEVELS[lvl][0])/(next[0]-LEVELS[lvl][0])*100:100,next,badges,count:rs.length,streak}}

/* briques */
function stars(v,id,small){let h='';for(let i=1;i<=5;i++){const c=v>=i*2?'f':v===i*2-1?'h':'';h+=`<span class="st ${c}" data-i="${i}">★</span>`}
  return`<span class="stars ${small?'sm':''}" ${id?`data-stars="${id}"`:''} role="img" aria-label="${fmt(v)} sur 5">${h}</span>`}
function poster(f,cls=''){const [a,b]=GRAD[hash(f.title)%GRAD.length];
  const bg=f.poster?`background-image:linear-gradient(transparent 50%,#000c),url('${e(f.poster)}')`:`background:linear-gradient(160deg,${a},${b})`;
  return`<div class="poster ${cls}" style="${bg}"><b>${e(f.title)}</b><small>${e(f.year)}${f.director?' · '+e(f.director):''}</small></div>`}
const watching=f=>S.watch.some(x=>x.id===f+'_'+S.meId);
function card(f){const mine=rOf(f.id,S.meId),up=f.status==='upcoming',t=liveOpen(f.id)&&!isDir()?null:avg(team(f.id).map(r=>r.stars));
  const tag=up?'Bientôt':f.featured?'⭐ Film de la semaine':isDir()?'':mine?'✔ Noté':'À noter';
  return`<div class="card" data-act="open" data-id="${f.id}" tabindex="0">${isDir()?'':`<button class="wt ${watching(f.id)?'on':''}" data-act="watch" data-id="${f.id}" aria-label="À voir plus tard" title="À voir plus tard">🔖</button>`}${poster(f).replace('<b>',`<span class="tag">${tag}</span><b>`)}
   <div class="cap"><span>${mine?stars(mine.stars,null,1):'<span class="dim">'+e(f.genre)+'</span>'}</span><span>${t!=null?'👥 '+fmt(t):''}</span></div></div>`}

function chalCards(){if(!S.chals.length)return'';const m=monthKey(Date.now()),cs=S.chals.filter(c=>c.month===m);if(!cs.length)return'';

function buildPool(){
  const have=new Set(S.films.map(f=>f.title.toLowerCase())),seen=new Set();
  const ideas=S.ideas.map(i=>({title:i.title,year:i.year||'',director:i.director||'',genre:i.genre||'Drame',from:'idea',id:i.id}));
  const cat=CAT.map(([title,year,director,genre])=>({title,year,director,genre,from:'cat'}));
  let p=(R.src==='ideas'?ideas:[...shuffle(ideas).slice(0,4),...shuffle(cat)]).filter(x=>{const k=x.title.toLowerCase();if(have.has(k)||seen.has(k)||(R.genre!=='all'&&x.genre!==R.genre))return false;seen.add(k);return true});
  R.total=p.length;if(!R.seen)R.seen=new Set();
  let fresh=p.filter(x=>!R.seen.has(x.title));if(fresh.length<12){R.seen=new Set();fresh=p}
  R.pool=[...fresh.filter(x=>x.from==='idea').slice(0,4),...fresh.filter(x=>x.from!=='idea')].slice(0,12);R.pool=shuffle(R.pool);R.pool.forEach(x=>R.seen.add(x.title));R.result=null}
function drawWheel(){const c=$('#wheel');if(!c||!R.pool.length)return;const x=c.getContext('2d'),W=c.width,cx=W/2,r=W/2-8,n=R.pool.length,seg=2*Math.PI/n;x.clearRect(0,0,W,W);
  for(let i=0;i<n;i++){x.beginPath();x.moveTo(cx,cx);x.arc(cx,cx,r,R.angle+i*seg,R.angle+(i+1)*seg);x.closePath();x.fillStyle=GRAD[i%6][i%2?1:0];x.fill();x.strokeStyle='#0f0e14';x.lineWidth=3;x.stroke();
    x.save();x.translate(cx,cx);x.rotate(R.angle+(i+.5)*seg);x.textAlign='right';x.fillStyle='#fff';const t=R.pool[i].title;x.font=(t.length>15?'600 14px':'600 16px')+' Inter,sans-serif';x.fillText(t.length>19?t.slice(0,18)+'…':t,r-18,6);x.restore()}
  x.beginPath();x.arc(cx,cx,34,0,7);x.fillStyle='#0f0e14';x.fill();x.fillStyle='#ffcc00';x.font='28px sans-serif';x.textAlign='center';x.fillText('🎬',cx,cx+10)}
function spin(){if(R.spinning||R.pool.length<2)return;R.spinning=true;R.result=null;const start=R.angle,extra=2*Math.PI*(5+Math.random()*3)+Math.random()*2*Math.PI,t0=performance.now(),D=4200;
  const step=t=>{const k=Math.min(1,(t-t0)/D);R.angle=start+extra*(1-Math.pow(1-k,3));drawWheel();
    if(k<1)requestAnimationFrame(step);else{R.spinning=false;const seg=2*Math.PI/R.pool.length,th=((-Math.PI/2-R.angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);R.result=R.pool[Math.min(R.pool.length-1,Math.floor(th/seg))];render()}};
  requestAnimationFrame(step)}

document.addEventListener('click',async ev=>{
  const sm=ev.target.closest('.st');
  if(sm){const box=sm.closest('[data-stars]');if(!box)return;const i=+sm.dataset.i,half=ev.offsetX<sm.offsetWidth/2,v=i*2-(half?1:0),[k,id]=box.dataset.stars.split(':');
    if(k==='quick'){if(isDir())put('ratings/'+rid(id,S.meId),{...(rOf(id,S.meId)||base(id)),stars:v});else setRating(id,v)}
    else if(k==='bet'){bet=v;render()}else if(k==='addnote'){addNote=v;box.outerHTML=stars(v,'addnote')}return}
  const t=ev.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  if(t.classList.contains('modal')&&ev.target!==t)return;
  if(act==='watch'){const k=id+'_'+S.meId;watching(id)?del('watch/'+k):put('watch/'+k,{filmId:id,userId:S.meId});return}
  if(act==='close'){film=null;adding=false;dTxt=dShot=null;prefill=null;render()}
  else if(act==='atab'){authTab=id;authMsg='';render()}
  else if(act==='nav'){view=id;film=null;render()}
  else if(act==='filter'){filter=id;render()}
  else if(act==='smode'){seasonMode=id;render()}
  else if(act==='open'){film=id;dTxt=dShot=null;bet=0;render()}
  else if(act==='add'){adding=true;addNote=0;posterUrl='';prefill=null;render();$('#ft')?.focus()}
  else if(act==='logout'){sb.auth.signOut()}
  else if(act==='avatar')upd('members/'+S.meId,{emoji:id})
  else if(act==='verdict')setVerdict(id,v)
  else if(act==='feature'){S.films.filter(x=>x.featured&&x.id!==id).forEach(x=>upd('films/'+x.id,{featured:false}));upd('films/'+id,{featured:true}).then(ok=>ok&&toast('Film mis en vedette ⭐'))}
  else if(act==='onair'){S.films.filter(x=>x.featured).forEach(x=>upd('films/'+x.id,{featured:false}));upd('films/'+id,{status:'live',featured:true,added:Date.now()}).then(ok=>ok&&toast('Film à l’affiche 🎬'))}
  else if(act==='startlive')put('config/live',{filmId:id,state:'open',started:Date.now()}).then(ok=>ok&&toast('Séance lancée : les résultats restent masqués'))
  else if(act==='reveal')upd('config/live',{state:'revealed'})
  else if(act==='endlive')del('config/live')
  else if(act==='del'){if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Confirmer la suppression';return}
    S.ratings.filter(r=>r.filmId===id).forEach(r=>del('ratings/'+r.id));del('films/'+id);if(liveFilm()===id)del('config/live');film=null;render()}
  else if(act==='like'){const r=S.ratings.find(x=>x.id===id);if(!r)return;if(r.userId===S.meId)return toast('On ne se like pas soi-même 😉');const k='likes/'+id+'_'+S.meId;(r.likes||[]).includes(S.meId)?del(k):put(k,{ratingId:id,userId:S.meId})}
  else if(act==='tag'){const r=rOf(film,S.meId);if(!r)return toast('Notez d’abord le film');const tg=r.tags||[];dTxt=$('#txt')?.value??dTxt;dShot=$('#shot')?.value??dShot;upd('ratings/'+r.id,{tags:tg.includes(id)?tg.filter(x=>x!==id):[...tg,id]})}
  else if(act==='exam'){const r=rOf(film,S.meId);if(!r)return toast('Notez d’abord le film');dTxt=$('#txt')?.value??dTxt;dShot=$('#shot')?.value??dShot;upd('ratings/'+r.id,{exam:r.exam===id?null:id})}
  else if(act==='publish'){const r=rOf(id,S.meId);if(!r)return toast('Notez d’abord le film');const text=$('#txt').value.trim(),shot=$('#shot').value.trim();dTxt=dShot=null;upd('ratings/'+r.id,{text,shot}).then(ok=>ok&&toast(text||shot?'Avis publié ✔ +XP':'Enregistré'))}
  else if(act==='trophy'){const r=S.ratings.find(x=>x.id===id);if(!r)return;S.ratings.filter(x=>x.filmId===r.filmId&&x.trophy===v&&x.id!==id).forEach(x=>del('trophies/'+x.id));(r.trophy===v?del('trophies/'+id):put('trophies/'+id,{filmId:r.filmId,kind:v})).then(ok=>ok&&r.trophy!==v&&toast('Trophée décerné 🏅 +25 XP'))}
  else if(act==='share')shareCard(id)
  else if(act==='vote'){const d=S.duels.find(x=>x.id===id);if(!d||!d.open)return;put('dvotes/'+id+'_'+S.meId,{duelId:id,userId:S.meId,pick:v})}
  else if(act==='closeduel'){const d=S.duels.find(x=>x.id===id),vs=S.dvotes.filter(x=>x.duelId===id),na=vs.filter(x=>x.pick==='a').length,nb=vs.filter(x=>x.pick==='b').length;upd('duels/'+id,{open:false,winner:na>=nb?d.a:d.b}).then(ok=>ok&&toast('Gagnant couronné 👑'))}
  else if(act==='remind'){showRemind=!showRemind;render()}
  else if(act==='copyrm'){const ta=$('#rm');try{await navigator.clipboard.writeText(ta.value);toast('Message copié')}catch{ta.select();toast('Sélectionné : copiez avec Ctrl+C')}}
  else if(act==='export'){try{await S.dl.save({filename:'saison-cine-club.csv',data:csvExport()})}catch{}}
  else if(act==='rsrc'){R.src=id;buildPool();render()}
  else if(act==='rgenre'){R.genre=id;buildPool();render()}
  else if(act==='reshuffle'){buildPool();render()}
  else if(act==='spin')spin()
  else if(act==='rpropose'){prefill=R.result;adding=true;addNote=0;posterUrl='';render();$('#ft')?.focus()}
  else if(act==='rkeep'){const r=R.result;put('ideas/'+uid(),{title:r.title,year:r.year,director:r.director,genre:r.genre,added:Date.now()}).then(ok=>ok&&toast('Ajouté à vos idées'))}
  else if(act==='ipropose'){prefill=S.ideas.find(x=>x.id===id);adding=true;addNote=0;posterUrl='';render();$('#ft')?.focus()}
  else if(act==='idel')del('ideas/'+id)
});
document.addEventListener('keydown',ev=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(ev.key==='Escape'){film=null;adding=false;dTxt=dShot=null;prefill=null;render()}
  else if(ev.key==='Enter'&&document.activeElement.classList?.contains('card')){film=document.activeElement.dataset.id;render()}
  else if(!typing&&S.db){if(ev.key==='/'){ev.preventDefault();$('#q')?.focus()}
    else if((ev.key==='n'||ev.key==='N')&&isDir()){ev.preventDefault();adding=true;addNote=0;posterUrl='';prefill=null;render();$('#ft')?.focus()}}
});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target,d=Object.fromEntries(new FormData(f));
  if(f.id==='authf')return doAuth(d);
  if(f.id==='addf'){const id='f'+uid(),up=!!d.up;
    if(d.feat&&!up)S.films.filter(x=>x.featured).forEach(x=>upd('films/'+x.id,{featured:false}));
    const ops=[put('films/'+id,{title:d.title.trim(),year:d.year||'',director:(d.director||'').trim(),genre:(d.genre||'Drame').trim(),pitch:(d.pitch||'').trim(),theme:d.theme||'',where:(d.where||'').trim(),ask:(d.ask||'').trim(),poster:(d.posterurl||'').trim(),featured:!!d.feat&&!up,status:up?'upcoming':'live',added:Date.now()})];
    if(addNote&&!up)ops.push(put('ratings/'+rid(id,S.meId),base(id,{stars:addNote})));
    const fromIdea=prefill&&prefill.from==='idea'?prefill.id:null;if(fromIdea)ops.push(del('ideas/'+fromIdea));
    adding=false;prefill=null;render();Promise.all(ops).then(()=>toast(up?'Film programmé pour plus tard 🗓️':'Film publié pour l’équipe 🎬'))}
  else if(f.id==='duelf'){if(d.a===d.b)return toast('Choisissez deux films différents');S.duels.filter(x=>x.open).forEach(x=>upd('duels/'+x.id,{open:false}));put('duels/'+uid(),{a:d.a,b:d.b,open:true,created:Date.now()}).then(ok=>ok&&toast('Duel lancé ⚔️'))}
  else if(f.id==='chalf'){put('challenges/'+uid(),{title:d.title.trim(),type:d.type,value:(d.value||'').trim(),target:Math.max(1,+d.target||1),month:monthKey(Date.now())}).then(ok=>ok&&toast('Défi lancé ⛳'))}
  else if(f.id==='ideaf'){put('ideas/'+uid(),{title:d.title.trim(),added:Date.now()}).then(ok=>{if(ok){const i=$('#idt');if(i){i.value='';i.focus()}}})}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){q=ev.target.value;render()}
  if(ev.target.id==='txt')dTxt=ev.target.value;
  if(ev.target.id==='shot')dShot=ev.target.value;
});
/* données : Supabase */
const COLLS=['films','ratings','members','config','ideas','duels','dvotes','challenges','watch','likes','trophies'];
const cache={};COLLS.forEach(c=>cache[c]=new Map());let profiles=[];
function derive(){
  const arr=c=>[...cache[c]].map(([id,d])=>({id,...d}));
  S.names=Object.fromEntries(profiles.map(p=>[p.id,{name:p.name}]));
  S.cfg={directorId:profiles.find(p=>p.role==='director')?.id};
  S.members=profiles.map(p=>({id:p.id,emoji:cache.members.get(p.id)?.emoji||EMOJIS[hash(p.id)%EMOJIS.length],role:p.role}));
  const lk={};arr('likes').forEach(l=>(lk[l.ratingId]=lk[l.ratingId]||[]).push(l.userId));
  S.films=arr('films');S.ideas=arr('ideas');S.duels=arr('duels');S.dvotes=arr('dvotes');S.chals=arr('challenges');S.watch=arr('watch');
  S.ratings=arr('ratings').map(r=>({...r,likes:lk[r.id]||[],trophy:cache.trophies.get(r.id)?.kind||null}));
  const lv=cache.config.get('live')?{...cache.config.get('live')}:null;
  if(lastLive&&lastLive.state==='open'&&lv&&lv.state==='revealed')toast('Les résultats de la séance sont révélés 🎬');
  S.live=lv;lastLive=lv}
async function loadAll(){
  const [d,p]=await Promise.all([sb.from('docs').select('coll,id,data'),sb.from('profiles').select('id,name,role')]);
  if(d.error)throw d.error;if(p.error)throw p.error;
  COLLS.forEach(c=>cache[c]=new Map());d.data.forEach(r=>cache[r.coll]&&cache[r.coll].set(r.id,r.data));profiles=p.data;derive()}
async function wr(path,op,data){
  const [c,id]=path.split('/'),m=cache[c];
  if(!m)throw{code:'invalid_argument'};
  if(op==='delete'){m.delete(id);derive();render();
    const {error}=await sb.from('docs').delete().eq('coll',c).eq('id',id);if(error){await loadAll().catch(()=>{});render();throw{code:'invalid_argument'}}return}
  const doc=op==='update'?{...(m.get(id)||{}),...data}:{...data};delete doc.id;if(c==='ratings'){delete doc.likes;delete doc.trophy}
  m.set(id,doc);derive();render();
  const {error}=await sb.from('docs').upsert({coll:c,id,data:doc,owner:S.meId});
  if(error){await loadAll().catch(()=>{});render();throw{code:'invalid_argument'}}}
const adapter={doc:p=>({set:d=>wr(p,'set',d),update:d=>wr(p,'update',d),delete:()=>wr(p,'delete')})};
const saver={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}};

/* connexion */
function authScreen(){return`<div class="login" style="min-height:90vh;display:grid;place-items:center"><div style="width:min(420px,100%);text-align:center">
  <div class="logo" style="font-size:34px">Ciné-Club <b>Imagerie</b></div><p class="dim" style="margin-top:6px">Les films d’Hervé, vos avis. Une séance à la fois.</p>
  <div class="row" style="justify-content:center;margin-top:22px"><button class="chip ${authTab==='in'?'on':''}" data-act="atab" data-id="in">Connexion</button><button class="chip ${authTab==='up'?'on':''}" data-act="atab" data-id="up">Créer mon compte</button></div>
  <form id="authf" style="display:grid;gap:10px;margin:22px 0;text-align:left">
   ${authTab==='up'?'<div class="field"><label for="an">Prénom et nom</label><input id="an" name="name" required autocomplete="name"></div>':''}
   <div class="field"><label for="ae">E-mail</label><input id="ae" name="email" type="email" required autocomplete="email" autofocus></div>
   <div class="field"><label for="ap">Mot de passe</label><input id="ap" name="pw" type="password" required minlength="6" autocomplete="${authTab==='up'?'new':'current'}-password"></div>
   ${authTab==='up'?'<div class="field"><label for="ac">Code d’invitation de l’équipe</label><input id="ac" name="invite" required autocomplete="off"></div>':''}
   <button class="btn" style="margin-top:6px">${authTab==='in'?'Entrer':'Rejoindre le ciné-club'}</button>
   ${authMsg?`<p style="color:var(--bad);font-size:14px">${e(authMsg)}</p>`:''}</form></div></div>`}
function setupScreen(){return`<div class="empty"><h2>Ciné-club à configurer</h2><p class="dim">Renseignez l’adresse et la clé publique Supabase dans <b>config.js</b> (voir le README).</p></div>`}
async function doAuth(d){
  authMsg='';const em=d.email.trim().toLowerCase();
  if(authTab==='in'){const {data,error}=await sb.auth.signInWithPassword({email:em,password:d.pw});if(error){authMsg='E-mail ou mot de passe incorrect.';return render()}return enter(data.user)}
  const {data,error}=await sb.auth.signUp({email:em,password:d.pw,options:{data:{name:d.name.trim(),invite:d.invite.trim()}}});
  if(error){authMsg=/database error|invite|invitation/i.test(error.message)?'Code d’invitation invalide.':error.message;return render()}
  if(!data.session){authMsg='Compte créé. Confirmez votre adresse e-mail puis connectez-vous.';authTab='in';return render()}
  return enter(data.user)}
let pollT=null;
async function enter(user){
  S.meId=user.id;S.db=adapter;S.dl=saver;S.ready=false;render();
  try{await loadAll()}catch{S.db=null;authMsg='Connexion au serveur impossible.';S.ready=true;return render()}
  if(!cache.members.has(S.meId))put('members/'+S.meId,{emoji:EMOJIS[hash(S.meId)%EMOJIS.length]});
  S.ready=true;render();clearInterval(pollT);
  pollT=setInterval(async()=>{if(document.hidden||adding||dTxt||dShot||S.db===null)return;try{await loadAll();render()}catch{}},8000)}
(async function(){
  const cf=window.CINECLUB||{};
  if(!cf.url||!cf.anonKey||/VOTRE/.test(cf.url)){S.ready=true;S.setup=true;return render()}
  sb=supabase.createClient(cf.url,cf.anonKey);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){clearInterval(pollT);S.db=null;S.meId=null;view='home';film=null;render()}});
  const {data:{session}}=await sb.auth.getSession();
  if(session)await enter(session.user);else{S.ready=true;render()}
})();
</script>
